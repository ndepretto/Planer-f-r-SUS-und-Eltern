<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Schul- und Hausaufgabenplaner</title>
    <!-- Lucide Icons für moderne Symbole -->
    <script src="https://unpkg.com"></script>
    <style>
        @layer base { 
            html, body { margin: 0; padding: 0; } 
            body { overscroll-behavior: none; } 
            main > :first-child { margin-top: 0 !important; } 
            main > :last-child { margin-bottom: 0 !important; } 
        } 
        ::-webkit-scrollbar { display: none; }
    </style>
    <!-- Tailwind CSS JIT -->
    <script src="https://tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-fixed-dim": "#7bd0ff",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#4c5851",
                        "on-surface-variant": "#434655",
                        "on-error": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "on-primary-fixed": "#00174b",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#eeefff",
                        "secondary-container": "#40c2fd",
                        "on-tertiary-container": "#e7f4eb",
                        "error": "#ba1a1a",
                        "background": "#f8f9ff",
                        "primary-container": "#2563eb",
                        "surface-tint": "#0053db",
                        "surface-variant": "#d3e4fe",
                        "surface-dim": "#cbdbf5",
                        "inverse-on-surface": "#eaf1ff",
                        "on-tertiary-fixed-variant": "#3e4943",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#d3e4fe",
                        "primary-fixed": "#dbe1ff",
                        "inverse-surface": "#213145",
                        "tertiary-fixed": "#d9e6dd",
                        "on-surface": "#0b1c30",
                        "outline": "#737686",
                        "surface-bright": "#f8f9ff",
                        "surface": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "primary-fixed-dim": "#b4c5ff",
                        "secondary-fixed": "#c4e7ff",
                        "on-secondary-fixed": "#001e2c",
                        "tertiary-fixed-dim": "#bdcac1",
                        "on-secondary-fixed-variant": "#004c69",
                        "on-primary-fixed-variant": "#003ea8"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface antialiased font-sans min-h-screen pb-12">

    <!-- Header Bereich -->
    <header class="bg-gradient-to-r from-primary-container via-secondary-container to-secondary-fixed-dim text-white shadow-lg mb-8">
        <div class="max-w-7xl mx-auto px-6 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight flex items-center gap-3">
                    <i data-lucide="graduation-cap" class="w-8 h-8"></i> Schüler-Schreibtisch & Planer
                </h1>
                <p class="text-on-primary-container/80 text-xs mt-1">Behalte deine Hausaufgaben und Termine im Griff</p>
            </div>
            
            <!-- Dynamische Übersicht / Statistik -->
            <div class="bg-white/10 backdrop-blur-md px-5 py-3 rounded-xl flex items-center gap-6 text-sm border border-white/20">
                <div class="text-center">
                    <span class="block text-xs text-on-primary-container/70">Offen</span>
                    <span id="stats-open" class="text-xl font-bold">0</span>
                </div>
                <div class="w-px h-8 bg-white/20"></div>
                <div class="text-center">
                    <span class="block text-xs text-on-primary-container/70">Erledigt</span>
                    <span id="stats-done" class="text-xl font-bold text-secondary-fixed">0</span>
                </div>
                <div class="w-px h-8 bg-white/20"></div>
                <div>
                    <span class="block text-xs text-on-primary-container/70 mb-1">Fortschritt</span>
                    <div class="w-24 bg-white/20 h-2 rounded-full overflow-hidden">
                        <div id="progress-bar" class="bg-white h-full w-[0%] transition-all duration-300 rounded-full shadow-[0_0_8px_rgba(255,255,255,0.5)]"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Hauptinhalt -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Linke Spalte: Neue Aufgabe eintragen -->
        <div class="space-y-6 lg:col-span-1">
            <div class="bg-surface-container-low border border-surface-variant p-5 rounded-2xl shadow-sm sticky top-6">
                <h3 class="text-md font-bold text-on-surface-variant mb-4 flex items-center gap-2 border-b border-surface-variant pb-2">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-primary-container"></i> Aufgabe eintragen
                </h3>
                
                <form id="task-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Beschreibung</label>
                        <input type="text" id="task-title" required class="w-full bg-white border border-outline/30 rounded-xl p-2.5 text-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container" placeholder="z.B. S. 45 Nr. 2a-c lesen">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-on-surface-variant mb-1">Fach</label>
                            <select id="task-subject" class="w-full bg-white border border-outline/30 rounded-xl p-2.5 text-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container">
                                <option value="Mathe">Mathe</option>
                                <option value="Deutsch">Deutsch</option>
                                <option value="Englisch">Englisch</option>
                                <option value="Französisch">Französisch</option>
                                <option value="Biologie">Biologie</option>
                                <option value="Geschichte">Geschichte</option>
                                <option value="Anderes">Anderes</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-on-surface-variant mb-1">Wochentag</label>
                            <select id="task-day" class="w-full bg-white border border-outline/30 rounded-xl p-2.5 text-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container">
                                <option value="monday">Montag</option>
                                <option value="tuesday">Dienstag</option>
                                <option value="wednesday">Mittwoch</option>
                                <option value="thursday">Donnerstag</option>
                                <option value="friday">Freitag</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Typ</label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="flex items-center gap-2 bg-white border border-outline/20 p-2 rounded-xl text-xs cursor-pointer">
                                <input type="radio" name="task-type" value="homework" checked class="text-primary-container focus:ring-primary-container">
                                Hausaufgabe
                            </label>
                            <label class="flex items-center gap-2 bg-white border border-outline/20 p-2 rounded-xl text-xs cursor-pointer">
                                <input type="radio" name="task-type" value="exam" class="text-error focus:ring-error">
                                <span class="text-error font-medium">Prüfung!</span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="w-full py-2.5 bg-primary-container text-white text-xs font-semibold rounded-xl hover:bg-surface-tint transition flex items-center justify-center gap-2 shadow-sm">
                        <i data-lucide="save" class="w-4 h-4"></i> Im Planer speichern
                    </button>
                </form>
            </div>
        </div>

        <!-- Rechte Spalte: Wochentage Grid -->
        <div class="lg:col-span-3 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            
            <!-- Montag -->
            <div class="bg-white border border-surface-container-high rounded-2xl shadow-sm overflow-hidden flex flex-col min-h-[250px]">
                <div class="bg-surface-container-low px-5 py-3 border-b border-surface-container-high flex justify-between items-center">
                    <span class="font-bold text-on-surface flex items-center gap-2">Montag</span>
                </div>
                <div id="day-monday" class="p-4 flex-1 space-y-2 task-container">
                    <!-- Aufgaben landen hier dynamisch -->
                </div>
