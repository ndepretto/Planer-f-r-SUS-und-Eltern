<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Mein schöner Wochenplaner</title>
    <!-- Lucide Icons für moderne Symbole -->
    <script src="https://unpkg.com"></script>
    <style>
        @layer base { 
            html, body { margin: 0; padding: 0; } 
            body { overscroll-behavior: none; } 
            main > :first-child { margin-top: 0 !important; } 
            main > :last-child { margin-bottom: 0 !important; } 
        } 
        ::-webkit-scrollbar { display: none; }
    </style>
    <!-- Tailwind CSS JIT -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-fixed-dim": "#7bd0ff",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#4c5851",
                        "on-surface-variant": "#434655",
                        "on-error": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "on-primary-fixed": "#00174b",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#eeefff",
                        "secondary-container": "#40c2fd",
                        "on-tertiary-container": "#e7f4eb",
                        "error": "#ba1a1a",
                        "background": "#f8f9ff",
                        "primary-container": "#2563eb",
                        "surface-tint": "#0053db",
                        "surface-variant": "#d3e4fe",
                        "surface-dim": "#cbdbf5",
                        "inverse-on-surface": "#eaf1ff",
                        "on-tertiary-fixed-variant": "#3e4943",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#d3e4fe",
                        "primary-fixed": "#dbe1ff",
                        "inverse-surface": "#213145",
                        "tertiary-fixed": "#d9e6dd",
                        "on-surface": "#0b1c30",
                        "outline": "#737686",
                        "surface-bright": "#f8f9ff",
                        "surface": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "primary-fixed-dim": "#b4c5ff",
                        "secondary-fixed": "#c4e7ff",
                        "on-secondary-fixed": "#001e2c",
                        "tertiary-fixed-dim": "#bdcac1",
                        "on-secondary-fixed-variant": "#004c69",
                        "on-primary-fixed-variant": "#003ea8"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface antialiased font-sans min-h-screen pb-12">

    <!-- Header Bereich -->
    <header class="bg-gradient-to-r from-primary-container via-secondary-container to-secondary-fixed-dim text-white shadow-lg mb-8">
        <div class="max-w-7xl mx-auto px-6 py-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold tracking-tight flex items-center gap-3">
                    <i data-lucide="calendar-days" class="w-8 h-8"></i> Mein Wochenplaner
                </h1>
                <p class="text-on-primary-container/80 text-sm mt-1">Organisiere deine Woche stilvoll und effizient</p>
            </div>
            <!-- Kalenderwoche & Info -->
            <div class="bg-white/10 backdrop-blur-md px-4 py-2 rounded-xl flex items-center gap-4 text-sm border border-white/20">
                <span class="font-medium flex items-center gap-2">
                    <i data-lucide="clock" class="w-4 h-4"></i> KW 38, 2026
                </span>
                <div class="w-px h-4 bg-white/20"></div>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-on-primary-container/90">Wochenfortschritt:</span>
                    <div class="w-24 bg-white/20 h-2 rounded-full overflow-hidden">
                        <div class="bg-white h-full w-[45%] rounded-full shadow-[0_0_8px_rgba(255,255,255,0.5)]"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Hauptinhalt -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Linke Spalte: Fokus & Notizen -->
        <div class="space-y-6 lg:col-span-1">
            <!-- Wochenfokus Card -->
            <div class="bg-surface-container-low border border-surface-variant p-6 rounded-2xl shadow-sm">
                <h3 class="text-lg font-bold text-on-surface-variant mb-4 flex items-center gap-2 border-b border-surface-variant pb-2">
                    <i data-lucide="target" class="w-5 h-5 text-primary-container"></i> Hauptfokus der Woche
                </h3>
                <textarea class="w-full bg-white border border-outline/30 rounded-xl p-3 text-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container resize-none" rows="3" placeholder="Was hat diese Woche oberste Priorität?"></textarea>
            </div>

            <!-- Top Prioritäten Liste -->
            <div class="bg-surface-container-low border border-surface-variant p-6 rounded-2xl shadow-sm">
                <h3 class="text-lg font-bold text-on-surface-variant mb-4 flex items-center gap-2 border-b border-surface-variant pb-2">
                    <i data-lucide="star" class="w-5 h-5 text-secondary-container"></i> Wichtige To-Dos
                </h3>
                <ul class="space-y-3">
                    <li class="flex items-center gap-3">
                        <input type="checkbox" class="w-4 h-4 rounded text-primary-container focus:ring-primary-container border-outline/40" id="todo1">
                        <label for="todo1" class="text-sm text-on-surface-variant cursor-pointer select-none">Projektpräsentation finalisieren</label>
                    </li>
                    <li class="flex items-center gap-3">
                        <input type="checkbox" class="w-4 h-4 rounded text-primary-container focus:ring-primary-container border-outline/40" id="todo2">
                        <label for="todo2" class="text-sm text-on-surface-variant cursor-pointer select-none">Arzttermin vereinbaren</label>
                    </li>
                    <li class="flex items-center gap-3">
                        <input type="checkbox" class="w-4 h-4 rounded text-primary-container focus:ring-primary-container border-outline/40" id="todo3">
                        <label for="todo3" class="text-sm text-on-surface-variant cursor-pointer select-none">Sportkleidung packen</label>
                    </li>
                </ul>
                <button class="mt-4 w-full py-2 bg-primary-container text-white text-xs font-semibold rounded-xl hover:bg-surface-tint transition flex items-center justify-center gap-2 shadow-sm">
                    <i data-lucide="plus" class="w-4 h-4"></i> Aufgabe hinzufügen
                </button>
            </div>

            <!-- Habit Tracker / Gewohnheiten -->
            <div class="bg-surface-container-low border border-surface-variant p-6 rounded-2xl shadow-sm">
                <h3 class="text-lg font-bold text-on-surface-variant mb-3 flex items-center gap-2 border-b border-surface-variant pb-2">
                    <i data-lucide="sparkles" class="w-5 h-5 text-tertiary"></i> Gewohnheiten
                </h3>
                <div class="space-y-3">
                    <div>
                        <div class="flex justify-between text-xs text-on-surface-variant mb-1">
                            <span>Wasser trinken (2L)</span>
                            <span class="font-medium text-primary-container">4/7 Tage</span>
                        </div>
                        <div class="flex gap-1">
                            <div class="h-2 flex-1 rounded bg-secondary-container"></div>
                            <div class="h-2 flex-1 rounded bg-secondary-container"></div>
                            <div class="h-2 flex-1 rounded bg-secondary-container"></div>
                            <div class="h-2 flex-1 rounded bg-secondary-container"></div>
                            <div class="h-2 flex-1 rounded bg-surface-variant"></div>
                            <div class="h-2 flex-1 rounded bg-surface-variant"></div>
                            <div class="h-2 flex-1 rounded bg-surface-variant"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs text-on-surface-variant mb-1">
                            <span>30 Min. Lesen</span>
                            <span class="font-medium text-tertiary">2/7 Tage</span>
                        </div>
                        <div class="flex gap-1">
                            <div class="h-2 flex-1 rounded bg-tertiary-fixed-dim"></div>
                            <div class="h-2 flex-1 rounded bg-tertiary-fixed-dim"></div>
                            <div class="h-2 flex-1 rounded bg-surface-variant"></div>
                            <div class="h-2 flex-1 rounded bg-surface-variant"></div>
                            <div class="h-2 flex-1 rounded bg-surface-variant"></div>
                            <div class="h-2 flex-1 rounded bg-surface-variant"></div>
                            <div class="h-2 flex-1 rounded bg-surface-variant"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Rechte Spalte: Wochentage Grid -->
        <div class="lg:col-span-3 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
