<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Schulplaner mit Eltern-Freigabe</title>
    <!-- Lucide Icons für Symbole -->
    <script src="https://unpkg.com"></script>
    <style>
        @layer base { 
            html, body { margin: 0; padding: 0; } 
            body { overscroll-behavior: none; } 
        } 
        .custom-scroll::-webkit-scrollbar { display: none; }
        .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <!-- Tailwind CSS JIT -->
    <script src="https://tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-fixed-dim": "#7bd0ff",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#4c5851",
                        "on-surface-variant": "#434655",
                        "on-error": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "on-primary-fixed": "#00174b",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#eeefff",
                        "secondary-container": "#40c2fd",
                        "on-tertiary-container": "#e7f4eb",
                        "error": "#ba1a1a",
                        "background": "#f8f9ff",
                        "primary-container": "#2563eb",
                        "surface-tint": "#0053db",
                        "surface-variant": "#d3e4fe",
                        "surface-dim": "#cbdbf5",
                        "inverse-on-surface": "#eaf1ff",
                        "on-tertiary-fixed-variant": "#3e4943",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#d3e4fe",
                        "primary-fixed": "#dbe1ff",
                        "inverse-surface": "#213145",
                        "tertiary-fixed": "#d9e6dd",
                        "on-surface": "#0b1c30",
                        "outline": "#737686",
                        "surface-bright": "#f8f9ff",
                        "surface": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "primary-fixed-dim": "#b4c5ff",
                        "secondary-fixed": "#c4e7ff",
                        "on-secondary-fixed": "#001e2c",
                        "tertiary-fixed-dim": "#bdcac1",
                        "on-secondary-fixed-variant": "#004c69",
                        "on-primary-fixed-variant": "#003ea8"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface antialiased font-sans min-h-screen flex flex-col">

    <!-- Minimalistischer, übersichtlicher Header -->
    <header class="bg-white border-b border-surface-container-high shadow-[0_1px_2px_rgba(0,0,0,0.03)] px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-lg bg-primary-container flex items-center justify-center text-white shadow-sm">
                    <i data-lucide="clipboard-check" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-inverse-surface">Hausaufgaben- & Kontrollzentrum</h1>
                    <p class="text-on-surface-variant text-xs">Schüler erfasst — Eltern unterschreiben digital</p>
                </div>
            </div>
            
            <!-- Info-Status -->
            <div id="parent-status-widget" class="text-xs bg-surface-container-low border border-surface-variant px-3 py-1.5 rounded-lg font-medium text-on-surface-variant flex items-center gap-2">
                <i data-lucide="info" class="w-4 h-4 text-primary-container"></i>
                <span id="widget-text">0 Aufgaben warten auf Unterschrift</span>
            </div>
        </div>
    </header>

    <!-- Hauptbereich -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 w-full">
        
        <!-- ================= LINKS: SCHÜLER-BEREICH (8 von 12 Spalten) ================= -->
        <div class="lg:col-span-8 space-y-6">
            
            <!-- Schnellerfasser-Zeile -->
            <div class="bg-white border border-surface-container-high p-4 rounded-xl shadow-sm">
                <form id="task-form" class="flex flex-col md:flex-row items-end gap-3">
                    <div class="flex-1 w-full">
                        <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Neue Aufgabe / Hausaufgabe</label>
                        <input type="text" id="task-title" required class="w-full bg-surface-container-low border border-surface-variant/50 rounded-lg p-2 text-sm text-on-surface focus:outline-none focus:ring-1 focus:ring-primary-container" placeholder="z.B. Mathebuch S. 44 Nr. 1 und 2">
                    </div>
                    <div class="w-full md:w-32">
                        <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Fach</label>
                        <select id="task-subject" class="w-full bg-surface-container-low border border-surface-variant/50 rounded-lg p-2 text-sm text-on-surface focus:outline-none">
                            <option value="Mathe">Mathe</option>
                            <option value="Deutsch">Deutsch</option>
                            <option value="Englisch">Englisch</option>
                            <option value="NMG / Bio">NMG / Bio</option>
                            <option value="Franz">Franz</option>
                            <option value="Anderes">Sonstiges</option>
                        </select>
                    </div>
                    <div class="w-full md:w-36">
                        <label class="block text-[11px] font-bold text-on-surface-variant uppercase mb-1">Abgabetag</label>
                        <select id="task-day" class="w-full bg-surface-container-low border border-surface-variant/50 rounded-lg p-2 text-sm text-on-surface focus:outline-none">
                            <option value="monday">Montag</option>
                            <option value="tuesday">Dienstag</option>
                            <option value="wednesday">Mittwoch</option>
                            <option value="thursday">Donnerstag</option>
                            <option value="friday">Freitag</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full md:w-auto px-4 py-2 bg-inverse-surface text-white text-sm font-semibold rounded-lg hover:bg-primary-container transition flex items-center justify-center gap-1.5 whitespace-nowrap shadow-sm">
                        <i data-lucide="plus" class="w-4 h-4"></i> Eintragen
                    </button>
                </form>
            </div>

            <!-- Die Schulwoche im Fokus -->
            <div class="space-y-3">
                <h3 class="text-sm font-bold text-inverse-surface uppercase tracking-wider flex items-center gap-2 px-1">
                    <i data-lucide="calendar" class="w-4 h-4 text-outline"></i> Aktuelle Schulwoche
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
                    <!-- Montag -->
                    <div class="bg-white border border-surface-container-high rounded-xl p-3 flex flex-col min-h-[220px]">
                        <div class="font-bold text-xs text-inverse-surface pb-1.5 border-b border-surface-container-low flex justify-between">
                            <span>Montag</span><span class="text-outline/40">Mo</span>
                        </div>
                        <div id="day-monday" class="space-y-1.5 pt-2 flex-1 overflow-y-auto custom-scroll"></div>
                    </div>
                    <!-- Dienstag -->
                    <div class="bg-white border border-surface-container-high rounded-xl p-3 flex flex-col min-h-[220px]">
                        <div class="font-bold text-xs text-inverse-surface pb-1.5 border-b border-surface-container-low flex justify-between">
                            <span>Dienstag</span><span class="text-outline/40">Di</span>
                        </div>
                        <div id="day-tuesday" class="space-y-1.5 pt-2 flex-1 overflow-y-auto custom-scroll"></div>
                    </div>
                    <!-- Mittwoch -->
                    <div class="bg-white border border-surface-container-high rounded-xl p-3 flex flex-col min-h-[220px]">
                        <div class="font-bold text-xs text-inverse-surface pb-1.5 border-b border-surface-container-low flex justify-between">
                            <span>Mittwoch</span><span class="text-outline/40">Mi</span>
                        </div>
                        <div id="day-wednesday" class="space-y-1.5 pt-2 flex-1 overflow-y-auto custom-scroll"></div>
                    </div>
                    <!-- Donnerstag -->
                    <div class="bg-white border border-surface-container-high rounded-xl p-3 flex flex-col min-h-[220px]">
                        <div class="font-bold text-xs text-inverse-surface pb-1.5 border-b border-surface-container-low flex justify-between">
                            <span>Donnerstag</span><span class="text-outline/40">Do</span>
                        </div>
                        <div id="day-thursday" class="space-y-1.5 pt-2 flex-1 overflow-y-auto custom-scroll"></div>
                    </div>
                    <!-- Freitag -->
