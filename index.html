<body class="bg-surface font-body-md text-on-surface">

    <!-- Feste Sidebar links -->
    <aside class="fixed left-0 top-0 h-full w-72 bg-surface-container-low z-50 flex flex-col pt-space-xl pb-space-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
        <div class="px-space-lg mb-space-lg flex items-center gap-space-sm">
            <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-on-primary font-headline-md shadow-sm">P</div>
            <div>
                <h1 class="font-headline-sm text-on-surface">Mein Schulplaner</h1>
                <p class="text-body-sm text-on-surface-variant">Woche perfekt im Griff</p>
            </div>
        </div>
        
        <!-- Navigation Buttons -->
        <nav class="flex-1 px-space-md space-y-space-xs">
            <div class="w-full flex items-center gap-space-md px-space-md py-space-sm rounded-lg bg-primary text-on-primary font-semibold shadow-xs">
                <span class="material-symbols-outlined">calendar_month</span>Wochenplaner
            </div>
        </nav>

        <!-- Status-Bereich für Freigabe in der Sidebar -->
        <div class="px-space-lg mb-4">
            <div id="sidebar-status-box" class="p-4 bg-error-container rounded-xl space-y-2 border border-error/20">
                <p class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">Status Eltern-Kontrolle</p>
                <div class="flex items-center gap-2">
                    <span id="status-icon" class="material-symbols-outlined text-error">lock</span>
                    <span id="status-text" class="text-xs font-semibold text-error">Diese Woche ununterschrieben</span>
                </div>
            </div>
        </div>

        <!-- User Profil Info unten -->
        <div class="px-space-lg pt-space-md">
            <div class="p-space-md bg-surface-container rounded-xl flex items-center gap-space-md">
                <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center">
                    <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
                </div>
                <div class="overflow-hidden">
                    <p class="text-label-md font-semibold text-on-surface truncate">Max Mustermann</p>
                    <p class="text-body-sm text-on-surface-variant">Schülerkonto</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Content-Bereich rechts neben Sidebar -->
    <div class="pl-72">
        <!-- Top Header Bar -->
        <header class="fixed top-0 left-72 right-0 h-16 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-40 flex items-center justify-between px-space-lg">
            <div class="flex items-center gap-space-md">
                <span class="material-symbols-outlined text-on-surface-variant">search</span>
                <input class="bg-transparent text-body-md text-on-surface outline-none placeholder:text-outline w-64" placeholder="Suche nach Aufgaben..." type="text"/>
            </div>
            <div class="flex items-center gap-space-md">
                <div id="header-counter-widget" class="text-label-sm font-semibold bg-surface-container px-3 py-1.5 rounded-lg flex items-center gap-2">
                    <span id="widget-text">0 Aufgaben insgesamt</span>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="relative pt-20 bg-surface min-h-screen px-space-gutter py-space-gutter">
            <div class="flex flex-col w-full pb-16 space-y-6">
                
                <!-- Schnelleingabe-Zeile für den Schüler -->
                <div class="bg-surface-container-lowest border border-surface-container-high p-5 rounded-2xl shadow-sm">
                    <h3 class="text-label-md font-bold text-on-surface mb-3 flex items-center gap-2">
                        <span class="material-symbols-outlined text-primary">add_circle</span> Hausaufgabe / Aufgabe hinzufügen
                    </h3>
                    <form id="task-form" class="flex flex-col lg:flex-row items-end gap-4">
                        <div class="flex-1 w-full">
