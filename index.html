<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Interaktiver Wochenplaner mit Eltern-Signatur</title>
    
    <!-- ÄNDERUNG: Direktes Laden von Tailwind als CSS (wird von GitHub nicht blockiert) -->
    <link href="https://cloudflare.com" rel="stylesheet">
    
    <!-- Google Material Icons & Fonts -->
    <link href="https://googleapis.com" rel="stylesheet"/>
    <link href="https://googleapis.com" rel="stylesheet"/>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9ff; margin: 0; padding: 0; overscroll-behavior: none; }
        ::-webkit-scrollbar { display: none; }
        .custom-scroll::-webkit-scrollbar { display: none; }
        .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Manuelle Farb-Zuweisung für absolute Unabhängigkeit vom JIT-Compiler auf GitHub */
        .bg-custom-primary { background-color: #004ac6; }
        .text-custom-on-primary { color: #ffffff; }
        .bg-custom-sidebar { background-color: #eff4ff; }
        .bg-custom-card { background-color: #ffffff; }
        .bg-custom-low { background-color: #f0f4ff; }
        .border-custom { border-color: #dce9ff; }
    </style>
</head>
<body class="text-gray-900 antialiased">

    <!-- Feste Sidebar links -->
    <aside class="fixed left-0 top-0 h-full w-72 bg-custom-sidebar z-50 flex flex-col pt-10 pb-10 shadow-sm border-r border-custom">
        <div class="px-6 mb-6 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-custom-primary flex items-center justify-center text-custom-on-primary font-bold text-xl shadow-sm">P</div>
            <div>
                <h1 class="text-lg font-bold tracking-tight">Mein Schulplaner</h1>
                <p class="text-gray-500 text-xs font-medium">Woche perfekt im Griff</p>
            </div>
        </div>
        
        <!-- Navigation Buttons -->
        <nav class="flex-1 px-4 space-y-1">
            <div class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg bg-custom-primary text-custom-on-primary font-semibold shadow-sm">
                <span class="material-symbols-outlined">calendar_month</span>Wochenplaner
            </div>
        </nav>

        <!-- Status-Bereich für Freigabe in der Sidebar -->
        <div class="px-6 mb-4">
            <div id="sidebar-status-box" class="p-4 bg-red-50 rounded-xl space-y-2 border border-red-100">
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Status Eltern-Kontrolle</p>
                <div class="flex items-center gap-2">
                    <span id="status-icon" class="material-symbols-outlined text-red-600">lock</span>
                    <span id="status-text" class="text-xs font-bold text-red-600">Ununterschrieben</span>
                </div>
            </div>
        </div>

        <!-- User Profil Info unten -->
        <div class="px-6 pt-4">
            <div class="p-4 bg-white/60 rounded-xl flex items-center gap-3 border border-custom">
                <div class="w-8 h-8 rounded-full bg-custom-primary flex items-center justify-center text-white">
                    <span class="material-symbols-outlined text-[18px]">person</span>
                </div>
                <div class="overflow-hidden">
                    <p class="text-sm font-bold text-gray-800 truncate">Max Mustermann</p>
                    <p class="text-xs text-gray-500">Schülerkonto</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Content-Bereich rechts neben Sidebar -->
    <div class="pl-72">
        <!-- Top Header Bar -->
        <header class="fixed top-0 left-72 right-0 h-16 bg-white/80 backdrop-blur-md shadow-sm z-40 flex items-center justify-between px-6 border-b border-custom">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-gray-400">search</span>
                <input class="bg-transparent text-sm text-gray-800 outline-none placeholder:text-gray-400 w-64" placeholder="Suche nach Aufgaben..." type="text"/>
            </div>
            <div class="flex items-center gap-3">
                <div id="header-counter-widget" class="text-xs font-semibold bg-gray-100 text-gray-600 px-3 py-1.5 rounded-lg flex items-center gap-2">
                    <span id="widget-text">0 Aufgaben insgesamt</span>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="relative pt-24 bg-gray-50 min-h-screen p-6">
            <div class="flex flex-col w-full pb-16 space-y-6">
                
                <!-- Schnelleingabe-Zeile für den Schüler -->
                <div class="bg-custom-card border border-custom p-5 rounded-2xl shadow-sm">
                    <h3 class="text-sm font-bold text-gray-800 mb-3 flex items-center gap-2">
                        <span class="material-symbols-outlined text-blue-600">add_circle</span> Hausaufgabe / Aufgabe hinzufügen
                    </h3>
                    <form id="task-form" class="flex flex-col lg:flex-row items-end gap-4">
                        <div class="flex-1 w-full">
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Was musst du tun?</label>
                            <input type="text" id="task-title" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm text-gray-800 focus:outline-none focus:border-blue-600 focus:bg-white transition-all" placeholder="z.B. Französisch-Vokabeln Unit 3 lernen">
                        </div>
                        <div class="w-full lg:w-44">
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Fach</label>
                            <select id="task-subject" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm text-gray-800 focus:outline-none">
                                <option value="Mathe">📐 Mathe</option>
                                <option value="Deutsch">📝 Deutsch</option>
                                <option value="Englisch">🇬🇧 Englisch</option>
                                <option value="Französisch">🇫🇷 Französisch</option>
                                <option value="Biologie">🌿 Biologie</option>
                                <option value="Sonstiges">✏️ Sonstiges</option>
                            </select>
                        </div>
                        <div class="w-full lg:w-44">
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Wochentag</label>
                            <select id="task-day" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm text-gray-800 focus:outline-none">
                                <option value="monday">Montag</option>
                                <option value="tuesday">Dienstag</option>
                                <option value="wednesday">Mittwoch</option>
                                <option value="thursday">Donnerstag</option>
                                <option value="friday">Freitag</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full lg:w-auto px-6 py-2.5 bg-custom-primary text-custom-on-primary font-semibold rounded-xl hover:opacity-90 transition flex items-center justify-center gap-1.5 shadow-sm">
                            <span class="material-symbols-outlined text-[20px]">add</span> Eintragen
                        </button>
                    </form>
                </div>

                <!-- Wochen-Grid und Elternbox auf einer Ebene -->
                <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
                    
                    <!-- Schulwoche Spalten (8 von 12 Spalten) -->
                    <div class="xl:col-span-8 space-y-4">
                        <div class="flex items-center justify-between px-1">
                            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-2">
                                <span class="material-symbols-outlined">calendar_view_week</span> Deine Schulwoche
                            </h3>
                            <button id="cleanup-btn" onclick="clearSignedTasks()" disabled class="px-3 py-1.5 rounded-xl text-xs font-bold bg-gray-200 text-gray-400 cursor-not-allowed flex items-center gap-1 transition-all">
                                <span class="material-symbols-outlined text-[18px]">delete_sweep</span> Aufgaben aufräumen
                            </button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4">
                            <!-- Montag -->
                            <div class="bg-custom-card border border-custom rounded-xl flex flex-col h-[320px] shadow-sm">
                                <div class="px-3 py-2 border-b border-custom bg-gray-50 rounded-t-xl flex justify-between items-center">
                                    <span class="font-bold text-xs text-gray-700">Montag</span>
                                    <span class="text-[10px] font-bold opacity-30">Mo</span>
                                </div>
                                <div id="day-monday" class="p-2 flex-1 overflow-y-auto space-y-2 custom-scroll"></div>
                            </div>
                            <!-- Dienstag -->
                            <div class="bg-custom-card border border-custom rounded-xl flex flex-col h-[320px] shadow-sm">
