<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/></head><body class="bg-background text-on-background font-body-md min-h-screen flex flex-col"><header class="bg-surface border-b border-outline-variant px-6 py-4 flex items-center justify-between sticky top-0 z-50"><div class="flex items-center gap-4"><h1 class="text-headline-md text-on-surface">Schul-Wochenplaner 2026</h1><nav class="hidden md:flex items-center gap-1 bg-surface-container p-1 rounded-lg"><button class="px-4 py-2 rounded-md text-label-md bg-primary text-on-primary transition-all" id="tab-wochenplanung" onclick="switchTab('wochenplanung')">Wochenplanung</button><button class="px-4 py-2 rounded-md text-label-md text-on-surface-variant hover:bg-surface-container-high transition-all" id="tab-schueler" onclick="switchTab('schueler')">Schüler-Ansicht</button><button class="px-4 py-2 rounded-md text-label-md text-on-surface-variant hover:bg-surface-container-high transition-all" id="tab-eltern" onclick="switchTab('eltern')">Eltern-Dashboard</button></nav></div><div class="flex items-center gap-3"><button class="px-4 py-2 rounded-lg bg-secondary-container text-on-secondary-container text-label-md font-medium flex items-center gap-2 hover:opacity-90" onclick="goToToday()"><span class="material-symbols-outlined text-sm">today</span>Heute</button><button class="px-4 py-2 rounded-lg bg-primary text-on-primary text-label-md font-medium flex items-center gap-2 shadow-sm" onclick="openTaskModal()"><span class="material-symbols-outlined text-sm">add</span>Aufgabe erstellen</button></div></header><main class="flex-1 p-6 max-w-7xl mx-auto w-full grid grid-cols-1 gap-6"><section class="space-y-6" id="view-wochenplanung"><div class="flex justify-between items-center bg-surface-container-low p-4 rounded-xl border border-outline-variant"><div class="flex items-center gap-3"><span class="material-symbols-outlined text-primary">calendar_month</span><h2 class="text-headline-sm text-on-surface" id="current-week-label">KW 12 (18.03.2024 - 24.03.2024)</h2></div><div class="flex gap-2"><button class="p-2 rounded-lg border border-outline-variant hover:bg-surface-container" onclick="changeWeek(-1)"><span class="material-symbols-outlined">chevron_left</span></button><button class="p-2 rounded-lg border border-outline-variant hover:bg-surface-container" onclick="changeWeek(1)"><span class="material-symbols-outlined">chevron_right</span></button></div></div><div class="grid grid-cols-1 md:grid-cols-5 gap-4" id="days-container"><!-- Dynamic days generated via script --></div></section><section class="hidden space-y-6" id="view-schueler"><div class="bg-surface p-6 rounded-xl border border-outline-variant"><h2 class="text-headline-md mb-4">Schüler-Ansicht</h2><p class="text-on-surface-variant mb-6">Übersicht aller anstehenden Aufgaben und Lernfortschritte für Schüler.</p><div class="space-y-4" id="schueler-tasks"></div></div></section><section class="hidden space-y-6" id="view-eltern"><div class="bg-surface p-6 rounded-xl border border-outline-variant"><h2 class="text-headline-md mb-4">Eltern-Dashboard</h2><p class="text-on-surface-variant mb-6">Bestätigung von Unterschriften und Wochenübersicht.</p><div class="space-y-4" id="eltern-signoffs"></div></div></section></main><!-- Modals --><div class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50" id="taskModal"><div class="bg-surface p-6 rounded-xl max-w-md w-full mx-4 space-y-4 border border-outline-variant"><h3 class="text-headline-sm">Neue Aufgabe erstellen</h3><input class="w-full p-3 rounded-lg border border-outline-variant bg-background" id="taskTitle" placeholder="Titel der Aufgabe" type="text"/><textarea class="w-full p-3 rounded-lg border border-outline-variant bg-background" id="taskDesc" placeholder="Beschreibung"></textarea><div class="grid grid-cols-2 gap-3"><select class="w-full p-3 rounded-lg border border-outline-variant bg-background text-sm" id="taskSubject"><option value="Mathematik">Mathematik</option><option value="Deutsch">Deutsch</option><option value="Englisch">Englisch</option><option value="Naturwissenschaften">Naturwissenschaften</option></select><select class="w-full p-3 rounded-lg border border-outline-variant bg-background text-sm" id="taskPriority"><option value="Normal">Normal</option><option value="Wichtig">Wichtig</option><option value="Dringend">Dringend</option></select></div><div class="flex justify-end gap-3"><button class="px-4 py-2 rounded-lg border border-outline-variant" onclick="closeTaskModal()">Abbrechen</button><button class="px-4 py-2 rounded-lg bg-primary text-on-primary" onclick="saveTask()">Speichern</button></div></div></div><script>function switchTab(tab) {document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));document.querySelectorAll('nav button').forEach(b => {b.classList.remove('bg-primary', 'text-on-primary');b.classList.add('text-on-surface-variant');});document.getElementById('view-' + tab).classList.remove('hidden');document.getElementById('tab-' + tab).classList.add('bg-primary', 'text-on-primary');document.getElementById('tab-' + tab).classList.remove('text-on-surface-variant');}function goToToday() {renderCalendar();alert('Auf den heutigen Tag und aktuelle Woche gewechselt!');}function openTaskModal() {document.getElementById('taskModal').classList.remove('hidden');}function closeTaskModal() {document.getElementById('taskModal').classList.add('hidden');}function saveTask() {closeTaskModal();alert('Aufgabe erfolgreich erstellt!');}function renderCalendar() {const container = document.getElementById('days-container');const days = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag'];container.innerHTML = days.map(d => `<div class="bg-surface p-4 rounded-xl border border-outline-variant flex flex-col gap-3"><h3 class="font-semibold text-on-surface">${d}</h3><div class="flex-1 bg-surface-container-low p-3 rounded-lg text-sm text-on-surface-variant min-h-[150px]">Keine Aufgaben</div><button onclick="openTaskModal()" class="text-xs text-primary font-medium hover:underline">+ Aufgabe</button></div>`).join('');}renderCalendar();</script></body></html>
